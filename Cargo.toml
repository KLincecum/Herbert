[workspace]
members = ["crates/herbert", "crates/herbert-contract", "crates/herbert-plugins"]
default-members = ["crates/herbert"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license-file = "LICENSE.md"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Preserve native decimal digits across host and plugin JSON boundaries.
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
schemars = "1"
herbert-contract = { path = "crates/herbert-contract" }

# Development and test builds (the test profile inherits dev). Incremental caches and full debug info were most of
# the October 28, 2026 build-cache growth that filled the system disk; see docs/BUILD-STORAGE.md. Line tables keep
# file and line numbers in panics and backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
strip = "debuginfo"

