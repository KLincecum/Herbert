[package]
name = "herbert-plugins"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[features]
# Optional C04 compiled UBAQ capture; only qualified matching packages may select it.
ubaq-compiled = []
# Unqualified optional feature; ordinary package builds preserve the current C08.
function-compiled = []
ordinary-bpm-compiled = []

[dependencies]
herbert-contract.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }


quick-xml = "0.41.0"

[build-dependencies]
serde_json.workspace = true
