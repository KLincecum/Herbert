[package]
name = "herbert-plugins"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[features]
# Optional BAQs and UBAQs compiled UBAQ capture; standard packages enable it.
ubaq-compiled = []
# Optional compiled Function capture; standard packages enable it.
function-compiled = []
ordinary-bpm-compiled = []
# One no-op feature per release plugin (scripts/build.py standard_plugin_features). It gives each plugin's build of
# this shared library its own fingerprint, so an unchanged plugin is not recompiled after another plugin's build.
plugin-ud-codes = []
plugin-ud-schema = []
plugin-extended-properties = []
plugin-baqs-and-ubaqs = []
plugin-bpm-directives = []
plugin-functions = []
plugin-classic-customizations = []
plugin-classic-personalizations = []
plugin-classic-dashboards = []
plugin-kinetic-applications-and-layers = []
plugin-kinetic-personalizations = []
plugin-searches-and-navigation = []
plugin-menus-and-launch-definitions = []
plugin-report-definitions = []
plugin-report-styles-and-layouts = []
plugin-report-behavior = []
plugin-configurators = []
plugin-business-rules-and-mappings = []
plugin-custom-resources = []
plugin-programs-and-extensions = []
plugin-solutions-and-packages = []
plugin-automation-and-integrations = []
plugin-access-and-assignments = []
plugin-configuration-references = []

[dependencies]
herbert-contract.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }


quick-xml = "0.41.0"

[build-dependencies]
serde_json.workspace = true
